# Human-auditable source of every verified asset coordinate (Phase 2).
# One block per asset_id. verify_assets.py joins this file to the Master CSV
# identity columns (asset_id, sector, name) and writes assets_verified.csv.
# Fields:
#   lat/lon        : researched coordinate (null when status is unverified)
#   role           : point | representative_midpoint
#   status         : verified | approximate_midpoint | unverified
#   source_url     : exact URL consulted for the coordinate (null if unverified)
#   provenance     : short source label (null if unverified)
#   truth_lat/truth_lon/truth_source_url : independent anchor reference (anchors only)
#   note           : factual justification, or the reason when unverified
# RULE: never invent a coordinate. An honest `unverified` is a correct result.
