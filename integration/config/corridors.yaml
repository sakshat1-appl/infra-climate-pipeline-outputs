# Highway corridors used for the rd_on_corridor_flag feature.
#
# Each corridor is an open polyline (or, for Hyderabad ORR, a closed ring)
# of [lat, lon] waypoints marking documented endpoints and major
# intermediate places on the alignment. An asset whose geodesic distance to
# the polyline is < 5 km receives rd_on_corridor_flag = true and the
# corridor's short name in rd_corridor_name.
#
# LIMITATION (read before reusing): these are straight-line approximations
# between documented places, NOT surveyed alignments. Real expressways curve
# between these points, so a flag near the 5 km boundary can be wrong in
# either direction. Waypoint coordinates are city/interchange midpoints from
# the public descriptions in the linked source articles, rounded to two
# decimals. Do not use this file for navigation or engineering.
#
# source_url is the public article from which the endpoint/interchange list
# for that corridor was taken (all Wikipedia, verified live on 2026-10-15;
# two of them are redirects to the canonical article, noted below).

corridors:
  - name: delhi_mumbai_expressway
    label: Delhi-Mumbai Expressway (NE-4)
    endpoints:
      a: {label: Delhi (DND), lat: 28.53, lon: 77.30}
      b: {label: Mumbai (JNPT link), lat: 18.95, lon: 73.05}
    waypoints:
      - [28.53, 77.30]
      - [28.25, 77.07]
      - [26.90, 76.33]
      - [25.21, 75.86]
      - [23.33, 75.08]
      - [22.30, 73.18]
      - [21.17, 72.83]
      - [18.95, 73.05]
    source_url: https://en.wikipedia.org/wiki/Delhi%E2%80%93Mumbai_Expressway
    notes: Via Sohna, Dausa, Kota, Ratlam, Vadodara, Surat (major interchanges per article).

